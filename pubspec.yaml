name: protofolio
description: "Romisaa Fadel — Flutter Developer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^15.1.2

  # Preference persistence (theme + locale)
  shared_preferences: ^2.3.3

  # Animation utilities
  flutter_animate: ^4.5.2

  # Google Fonts (Outfit)
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

  # Web platform API (anchor-tag download for CV)
  web: ^1.1.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/splash_background.png
    - assets/images/profile.jpg
    - assets/images/projects/nutrimind/
    - assets/images/projects/sanad/
    - assets/images/projects/qoot/
    - assets/images/projects/rafeeq/
    - assets/documents/

flutter_native_splash:
  color: "#291C29"
  color_dark: "#291C29"
  background_image: "assets/images/splash_background.png"
  background_image_dark: "assets/images/splash_background.png"
  image: "assets/images/logo.png"
  image_dark: "assets/images/logo.png"
  web_image_mode: center
  android: false
  ios: false
  web: true

