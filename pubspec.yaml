name: protofolio
description: "Romisaa Fadel — Flutter Developer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^15.1.2

  # Preference persistence (theme + locale)
  shared_preferences: ^2.3.3

  # Animation utilities
  flutter_animate: ^4.5.2

  # Google Fonts (Outfit)
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

  # Web platform API (anchor-tag download for CV)
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/profile.jpg
    - assets/documents/
